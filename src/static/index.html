<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agente Interno Malatesta</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto;">
  <h2>Agente Interno Malatesta</h2>
  <p>Pregunta sobre recetas, costos de fabricación por cantidad, o producción diaria.</p>
  <textarea id="pregunta" rows="3" style="width:100%" placeholder="Ej: ¿Cuánto me cuesta hacer 50 medialunas de pistacho?"></textarea>
  <br><br>
  <button onclick="preguntar()">Preguntar</button>
  <pre id="respuesta" style="white-space: pre-wrap; background:#f0f0f0; padding:10px; margin-top:20px;"></pre>

  <script>
    async function preguntar() {
      const pregunta = document.getElementById('pregunta').value;
      const salida = document.getElementById('respuesta');
      salida.textContent = 'Pensando...';
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pregunta })
      });
      const data = await res.json();
      salida.textContent = data.respuesta || JSON.stringify(data);
    }
  </script>
</body>
</html>
